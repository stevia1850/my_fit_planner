<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2f4a3c" />
<meta name="apple-mobile-web-app-title" content="My Fit" />
<title>My Fit</title>
<style>
  :root { --bg:#efe8dc; --paper:#fffdf8; --ink:#1c261f; --muted:#5c675f; --line:#e2d4be; --green:#2f4a3c; --soft:#e7efe8; --sand:#f3ead6; --warn:#8a4b12; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#efe8dc; color:var(--ink); font-size:17px; line-height:1.45; }
  .app { max-width:840px; margin:0 auto; padding:18px 16px 110px; }
  .logo { font-size:12px; letter-spacing:.14em; color:var(--green); font-weight:800; }
  h1 { font-size:28px; letter-spacing:-.04em; margin:6px 0 4px; }
  h2 { font-size:20px; margin:22px 0 10px; }
  .sub { color:var(--muted); font-size:15px; }
  nav { display:flex; gap:8px; overflow-x:auto; padding:10px 0 14px; position:sticky; top:0; background:rgba(239,232,220,.96); z-index:6; }
  nav button { border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:10px 14px; font-size:15px; font-weight:800; white-space:nowrap; }
  nav button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .metric,.card { background:var(--paper); border:1px solid var(--line); border-radius:18px; }
  .metric { padding:12px; } .metric b{display:block;font-size:22px;margin-top:4px;} .metric span{color:var(--muted);font-size:13px;}
  .card { padding:16px; margin:12px 0; }
  .week { display:flex; gap:8px; overflow-x:auto; }
  .wday { min-width:96px; flex:1; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:10px; font-size:14px; }
  .wday.today { background:var(--soft); border-color:var(--green); }
  .wday.done { background:var(--sand); }
  .chip { display:inline-block; background:var(--soft); color:var(--green); border-radius:999px; padding:4px 10px; font-size:13px; margin:0 4px 8px 0; font-weight:700; }
  .warn { color:var(--warn); font-size:14px; font-weight:700; }
  input,select,textarea { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); font:inherit; background:#fff; font-size:17px; }
  textarea { min-height:110px; }
  .act { width:100%; padding:14px; border:0; border-radius:14px; background:var(--green); color:#fff; font-weight:800; font-size:17px; margin-top:10px; }
  .ghost { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:15px; font-weight:700; }
  .sets { display:grid; grid-template-columns:78px 1fr 1fr; gap:8px; align-items:center; margin-top:8px; }
  table { width:100%; border-collapse:collapse; }
  td,th { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); font-size:15px; }
  .row { display:flex; gap:8px; } .row>*{flex:1;}
  .calwrap { overflow-x:auto; }
  .cal { width:100%; border-collapse:separate; border-spacing:6px; min-width:520px; }
  .cal th { font-size:14px; color:var(--muted); }
  .cal td { height:86px; width:14%; background:var(--paper); border:1px solid var(--line); border-radius:12px; vertical-align:top; padding:6px; font-size:13px; cursor:pointer; }
  .cal td.today { outline:2px solid var(--green); }
  .cal td.done { background:var(--sand); }
  .cal td.empty { background:transparent; border:0; }
  .sticky { position:sticky; bottom:12px; z-index:7; }
  .name { font-size:19px; font-weight:800; }
</style>
</head>

function estimate(text){
  const raw=(text||"").trim();
  if(!raw) return {items:[],kcal:0,protein:0,note:"먹은 것을 적으면 바로 계산합니다."};
  const t=raw.replace(/\s+/g,"");
  const items=[];
  const used=new Set();
  const sorted=[...FOODS].sort((a,b)=>b[3][0].length-a[3][0].length);
  for(const [name,k,p,keys] of sorted){
    const hit=keys.some(key=>t.includes(key.replace(/\s+/g,"")));
    if(hit && !used.has(name)){
      // 상위 요리가 이미 포함하면 하위 중복 스킵
      if(name==="밥" && items.some(i=>i.name.includes("볶음밥")||i.name.includes("덮밥")||i.name.includes("비빔밥")||i.name.includes("김밥"))) continue;
      if(name==="김치" && items.some(i=>i.name.includes("김치"))) continue;
      if(name==="돼지고기" && items.some(i=>i.name.includes("돼지")||i.name.includes("제육"))) continue;
      if(name==="닭고기" && items.some(i=>i.name.includes("닭"))) continue;
      used.add(name); items.push({raw:name,name,kcal:k,protein:p});
    }
  }
  if(!items.length){
    return {items:[{raw,name:"한 끼 추정",kcal:550,protein:22}],kcal:550,protein:22,note:"메뉴를 특정하지 못해 일반 한 끼로 잡았습니다. 숫자를 직접 고쳐도 됩니다."};
  }
  const kcal=items.reduce((a,b)=>a+b.kcal,0);
  const protein=items.reduce((a,b)=>a+b.protein,0);
  return {items,kcal,protein,note:"문장 안에서 음식을 찾아 합산한 대략값입니다. 양에 따라 직접 수정하세요."};
}
function analyze(){const counts=Object.fromEntries(PARTS.map(p=>[p,0])); const thisWeek=workouts.filter(w=>sameWeek(new Date(w.date),today)); thisWeek.forEach(w=>(w.ids||[]).forEach(id=>{if(PART_MAP[id]) counts[PART_MAP[id]]++;})); return {n:thisWeek.length,counts,missing:PARTS.filter(p=>counts[p]===0)};}
function sameWeek(a,b){const sa=new Date(a), sb=new Date(b); sa.setDate(sa.getDate()-((sa.getDay()+6)%7)); sb.setDate(sb.getDate()-((sb.getDay()+6)%7)); return iso(sa)===iso(sb);}
function nav(){const pages=[["오늘","🏋️"],["달력","📅"],["운동선택","🧩"],["피드백","🧠"],["기록","📒"],["몸","🪞"],["식단","🍱"],["설정","🔧"]]; document.getElementById("nav").innerHTML=pages.map(([p,i])=>`<button class="${p===page?'on':''}" onclick="page='${p}';render()">${i} ${p}</button>`).join("");}
function weekStrip(){return `<div class="week">${weekDates().map(d=>{const plan=PLAN[(d.getDay()+6)%7]; const has=workouts.some(w=>w.date===iso(d)); return `<div class="wday ${iso(d)===todayStr?'today':''} ${has?'done':''}"><b>${WD[(d.getDay()+6)%7]} ${d.getDate()}</b><div class="sub">${has?'기록됨':plan.title}</div></div>`;}).join("")}</div>`;}
function monthGrid(){
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  const first=new Date(y,m,1);
  const start=(first.getDay()+6)%7;
  const last=new Date(y,m+1,0).getDate();
  let cells="";
  for(let i=0;i<start;i++) cells+=`<td class="empty"></td>`;
  for(let d=1;d<=last;d++){
    const date=new Date(y,m,d); const key=iso(date);
    const plan=PLAN[(date.getDay()+6)%7];
    const has=workouts.some(w=>w.date===key);
    const food=diet.some(x=>x.date===key);
    cells+=`<td class="${key===todayStr?'today':''} ${has?'done':''}" onclick="selectedDay='${key}';render()"><b>${d}</b><div>${plan.title.slice(0,6)}</div><div>${has?'운동':''} ${food?'식단':''}</div></td>`;
    if((start+d)%7===0) cells+="</tr><tr>";
  }
  return `<div class="row"><button class="ghost" onclick="calCursor.setMonth(calCursor.getMonth()-1);render()">이전달</button><div style="text-align:center;font-weight:800;padding-top:8px">${y}.${String(m+1).padStart(2,'0')}</div><button class="ghost" onclick="calCursor.setMonth(calCursor.getMonth()+1);render()">다음달</button></div>
  <div class="calwrap"><table class="cal"><tr>${WD.map(w=>`<th>${w}</th>`).join("")}</tr><tr>${cells}</tr></table></div>`;
}
function exCard(id,prefix){
  const [name,eq,mus,safe,how]=EX[id];
  const rx=RX[id]||{n:3,w:[0,0,0],r:[10,10,10],t:"3×10"};
  const prev=lastLogs(name);
  const n=(prev&&prev.sets&&prev.sets.length)||rx.n;
  let rows="";
  for(let i=0;i<n;i++){
    const pw=prev?.sets?.[i]?.w??rx.w[i]??0;
    const pr=prev?.sets?.[i]?.r??rx.r[i]??10;
    rows+=`<div class="sets"><b>${i+1}세트</b><input type="number" step="2.5" value="${pw}"><input type="number" value="${pr}"></div>`;
  }
  const pick = prefix==="pick" ? `<label style="display:block;margin-top:8px"><input type="checkbox" class="pickbox" data-id="${id}"> 이 운동 고르기</label>` : `<label><input type="checkbox" class="use"> 했다</label>`;
  const rm = prefix==="extra" ? `<button class="ghost" onclick="removeExtra('${id}')">오늘에서 빼기</button>` : "";
  return `<div class="card" data-ex="${id}">
    <div class="name">${name} ${safe?"":'<span class="warn">어깨주의</span>'}</div>
    <div class="sub">${eq} · ${mus}</div>
    <span class="chip">추천 ${rx.t}</span>
    ${prev?`<span class="chip">지난번 ${(prev.sets||[]).map(s=>s.w+'kg × '+s.r).join(' / ')}</span>`:""}
    <details><summary>방법</summary><p>${how}</p></details>
    ${prefix==="pick"?pick:`${pick}<div class="setbox">${rows}</div>${rm}`}
  </div>`;
}
function collect(){return [...document.querySelectorAll(".card[data-ex]")].map(card=>{
  const id=card.dataset.ex; if(!EX[id]) return null;
  const sets=[...card.querySelectorAll(".setbox .sets")].map(row=>{const ins=row.querySelectorAll("input"); return {w:+ins[0].value||0,r:+ins[1].value||0};});
  const used=card.querySelector(".use")?.checked||sets.some(s=>s.w||s.r);
  return used?{id,name:EX[id][0],sets,safe:EX[id][3]}:null;
}).filter(Boolean);}
function addPicked(){
  const ids=[...document.querySelectorAll(".pickbox:checked")].map(x=>x.dataset.id);
  if(!ids.length){alert("운동을 하나 이상 고르세요");return;}
  ids.forEach(id=>{if(!extras.ids.includes(id)) extras.ids.push(id);});
  extras.date=todayStr; save("mf_extras",extras);
  alert(ids.length+"개를 오늘 운동에 넣었습니다.");
  page="오늘"; render();
}
function removeExtra(id){extras.ids=extras.ids.filter(x=>x!==id); save("mf_extras",extras); render();}
function render(){
  nav();
  const plan=PLAN[(today.getDay()+6)%7];
  const an=analyze();
  document.getElementById("headSub").textContent=`${todayStr} (${WD[(today.getDay()+6)%7]}) · ${plan.title}`;
  const main=document.getElementById("main");
  if(page==="오늘"){
    const planned=[...plan.warmup,...plan.main,...plan.cardio];
    const extraIds=extras.ids.filter(id=>!planned.includes(id));
    main.innerHTML=`<div class="grid4">
      <div class="metric"><span>체중</span><b>${profile.weight}kg</b></div>
      <div class="metric"><span>체지방</span><b>${profile.fat}%</b></div>
      <div class="metric"><span>8주</span><b>${profile.mid}%</b></div>
      <div class="metric"><span>이번주</span><b>${an.n}회</b></div></div>
      <p class="sub">2개월 ${profile.mid}% · 하루 ${profile.kcal}kcal / 단백질 ${profile.protein}g</p>
      <h2>📅 이번 주</h2>${weekStrip()}
      <label><input id="pain" type="checkbox"> 오늘 어깨가 투정 부린다</label>
      ${["warmup","main","cardio"].map(sec=>{if(!plan[sec].length) return ""; const title=sec==="warmup"?"🌡️ 워밍업":sec==="main"?"🧱 본운동":"🏃 유산소 · 하나만"; return `<h2>${title}</h2>`+plan[sec].map(id=>exCard(id,sec)).join("");}).join("")}
      <h2>🧩 내가 끼워 넣은 운동</h2>
      ${extraIds.length? extraIds.map(id=>exCard(id,"extra")).join("") : `<p class="sub">운동선택에서 여러 개를 고른 뒤 한 번에 넣을 수 있습니다.</p>`}
      <input id="note" placeholder="오늘 한 줄 메모">
      <button class="act" onclick="saveToday()">오늘 운동 저장</button>`;
  } else if(page==="달력"){
    const day=new Date(selectedDay+"T00:00:00");
    const pl=PLAN[(day.getDay()+6)%7];
    const ids=[...pl.warmup,...pl.main,...pl.cardio];
    const logs=workouts.filter(w=>w.date===selectedDay);
    const meals=diet.filter(d=>d.date===selectedDay);
    main.innerHTML=`<h2>📅 달력</h2>${monthGrid()}
      <div class="card"><div class="name">${selectedDay} · ${pl.title}</div>
      <div class="sub">${ids.length?ids.map(id=>EX[id][0]).join(" · "):"휴식"}</div>
      ${logs.length?logs.map(w=>`<p>운동 기록: ${(w.names||[]).join(", ")}</p>`).join(""):"<p class='sub'>이 날 운동 기록 없음</p>"}
      ${meals.length?meals.map(m=>`<p>식단: ${m.meal} ${m.content} (${m.protein}g / ${m.kcal}kcal)</p>`).join(""):"<p class='sub'>이 날 식단 기록 없음</p>"}
      </div>`;
  } else if(page==="운동선택"){
    main.innerHTML=`<p class="sub">원하는 운동을 여러 개 체크한 다음, 아래 버튼으로 오늘에 한 번에 넣으세요. 화면이 바뀌지 않습니다.</p>`
      +Object.entries(CATS).map(([c,ids])=>`<h2>${c}</h2>`+ids.map(id=>exCard(id,"pick")).join("")).join("")
      +`<button class="act sticky" onclick="addPicked()">선택한 운동 오늘에 넣기</button>`;
  } else if(page==="피드백"){
    main.innerHTML=`<div class="card">이번 주 ${an.n}회 · ${an.missing.length?("빈칸: "+an.missing.join(", ")):"부위는 골고루 했습니다."}</div><table>${PARTS.map(p=>`<tr><td>${p}</td><td>${an.counts[p]}회</td></tr>`).join("")}</table>`;
  } else if(page==="기록"){
    main.innerHTML=workouts.slice().reverse().map(w=>`<div class="card"><div class="name">${w.date} · ${w.plan||""}</div>${(w.details||[]).map(d=>`<div>${d.name} · ${(d.sets||[]).map(s=>s.w+"kg × "+s.r).join(" / ")}</div>`).join("")}<button class="ghost" onclick="delW('${w.ts}')">삭제</button></div>`).join("")||"<p>아직 기록이 없습니다.</p>";
  } else if(page==="몸"){
    main.innerHTML=`<div class="row"><input id="bw" type="number" step="0.1" value="${profile.weight}"><input id="bf" type="number" step="0.1" value="${profile.fat}"></div><button class="act" onclick="saveBody()">신체 저장</button><table>${body.slice().reverse().map(b=>`<tr><td>${b.date}</td><td>${b.weight}kg</td><td>${b.fat}%</td></tr>`).join("")}</table>`;
  } else if(page==="식단"){
    main.innerHTML=`<p class="sub">한 줄로 적어도 됩니다. 예: 돼지고기 양배추 볶음밥</p>
      <select id="meal"><option>아침</option><option>점심</option><option>저녁</option><option>간식</option></select>
      <textarea id="food" oninput="liveFood()" placeholder="돼지고기 양배추 볶음밥"></textarea>
      <div class="row"><div class="metric"><span>단백질</span><b id="gp">0g</b></div><div class="metric"><span>칼로리</span><b id="gk">0kcal</b></div></div>
      <p class="sub" id="gnote"></p><div id="flist"></div>
      <div class="row"><input id="protEdit" type="number" placeholder="단백질 수정"><input id="kcalEdit" type="number" placeholder="칼로리 수정"></div>
      <button class="act" onclick="saveDiet()">식단 저장</button>
      <h2>오늘</h2><div id="dtoday"></div>`; drawDiet();
  } else {
    main.innerHTML=`<input id="pn" value="${profile.name}"><div class="row"><input id="pp" type="number" value="${profile.protein}"><input id="pk" type="number" value="${profile.kcal}"></div><button class="act" onclick="saveProf()">설정 저장</button><button class="ghost" onclick="backup()">백업 받기</button>`;
  }
}
function liveFood(){
  const g=estimate(document.getElementById("food").value);
  document.getElementById("gp").textContent=g.protein+"g";
  document.getElementById("gk").textContent=g.kcal+"kcal";
  document.getElementById("gnote").textContent=g.note;
  document.getElementById("protEdit").value=g.protein;
  document.getElementById("kcalEdit").value=g.kcal;
  document.getElementById("flist").innerHTML=`<table>${g.items.map(i=>`<tr><td>${i.name}</td><td>${i.protein}g</td><td>${i.kcal}kcal</td></tr>`).join("")}</table>`;
}
function drawDiet(){
  const list=diet.filter(d=>d.date===todayStr);
  const p=list.reduce((a,b)=>a+(+b.protein||0),0), k=list.reduce((a,b)=>a+(+b.kcal||0),0);
  document.getElementById("dtoday").innerHTML=`<p><b>합계 ${p}g / ${k}kcal</b></p>`+list.map(d=>`<div class="card">${d.meal} · ${d.content}<div class="sub">${d.protein}g / ${d.kcal}kcal</div><button class="ghost" onclick="delDiet('${d.ts}')">삭제</button></div>`).join("");
}
function saveToday(){const pain=document.getElementById("pain")?.checked; let rows=collect(); const plan=PLAN[(today.getDay()+6)%7]; if(plan.title.includes("밀기")&&!rows.some(r=>["arm_circle","scapular_pushup","band_er","face_pull_wu"].includes(r.id))){alert("밀기 날엔 워밍업을 남기세요.");return;} if(pain) rows=rows.filter(r=>r.safe); if(!rows.length){alert("운동을 입력하세요");return;} workouts.push({date:todayStr,ts:Date.now(),plan:plan.title,ids:rows.map(r=>r.id),names:rows.map(r=>r.name),details:rows,note:document.getElementById("note")?.value||""}); save("mf_workouts",workouts); extras.ids=[]; save("mf_extras",extras); alert("저장했습니다"); page="기록"; render();}
function delW(ts){workouts=workouts.filter(w=>String(w.ts)!==String(ts)); save("mf_workouts",workouts); render();}
function saveBody(){profile.weight=+document.getElementById("bw").value; profile.fat=+document.getElementById("bf").value; body.push({date:todayStr,weight:profile.weight,fat:profile.fat}); save("mf_profile",profile); save("mf_body",body); render();}
function saveDiet(){const g=estimate(document.getElementById("food").value); const protein=+(document.getElementById("protEdit").value||g.protein); const kcal=+(document.getElementById("kcalEdit").value||g.kcal); diet.push({ts:Date.now(),date:todayStr,meal:document.getElementById("meal").value,content:document.getElementById("food").value,protein,kcal}); save("mf_diet",diet); render();}
function delDiet(ts){diet=diet.filter(d=>String(d.ts)!==String(ts)); save("mf_diet",diet); render();}
function saveProf(){profile.name=document.getElementById("pn").value; profile.protein=+document.getElementById("pp").value; profile.kcal=+document.getElementById("pk").value; save("mf_profile",profile); alert("저장");}
function backup(){const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify({profile,workouts,diet,body},null,2)],{type:"application/json"})); a.download="myfit.json"; a.click();}
render();
</script>
</body>
</html>
